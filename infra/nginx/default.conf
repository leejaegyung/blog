server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200M;

    # app 컨테이너가 다시 만들어지면 IP가 바뀐다. 변수로 넘겨 Docker DNS에서 매번 다시 조회한다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream app:9000;

    # Laravel: API, Sanctum CSRF 쿠키, 헬스체크
    location ~ ^/(api|sanctum|up)(/|$) {
        fastcgi_pass $app_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 330;  # AI 호출(320초)보다 길게
    }

    # Vue SPA (history 모드)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
